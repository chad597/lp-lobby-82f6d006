    <path d="M11 26 Q16 19 20 21 Q24 23 29 18" stroke="#8B7355" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M12 18 Q16 13 20 15 Q24 17 28 11" stroke="#3d6b4f" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
